<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>Login</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <ion-header collapse="condense">
    <ion-toolbar>
      <ion-title size="large">Login</ion-title>
    </ion-toolbar>
  </ion-header>

  <div class="centred-wrapper">
    <ion-grid>
      <ion-row class="ion-align-items-center ion-justify-content-center" style="height: 100%">
        <ion-col size="12" sizemd="8" sizelg="6">
          <ion-card>
            <img src="assets/AuPairGoLogo.jpg" alt="AuPairGoLogo" loading="lazy" />
            <ion-card-header> Welcome to Au Pair go!</ion-card-header>
            <ion-card-content>
              <ion-button color="primary" expand="block">I Am A Parent</ion-button>
              <ion-button color="primary" expand="block">I Am A Au Pair</ion-button>
            </ion-card-content>
          </ion-card>
        </ion-col>
      </ion-row>
    </ion-grid>
  </div>
</ion-content>
