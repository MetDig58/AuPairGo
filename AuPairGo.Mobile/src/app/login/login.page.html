<ion-header name="back-button" class="ion-no-border" style="position: absolute; top: 0; width: 100%; z-index: 10">
  <ion-toolbar style="--background: transparent">
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/home" text="Back"></ion-back-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content scrollY="false" [fullscreen]="true" class="ion-padding">
  <div class="page-wrapper">
    <ion-card class="custom-dark-card">
      <ion-card-content class="card-content-layout">
        <h2 class="login-title">Login</h2>

        <!-- 1. Bound email to ngModel -->
        <ion-input type="email" placeholder="Enter your email" [(ngModel)]="email" name="email" autocomplete="email">
        </ion-input>

        <!-- 2. Bound password to ngModel -->
        <ion-input
          [type]="showPassword ? 'text' : 'password'"
          placeholder="Enter your password"
          [(ngModel)]="password"
          name="password"
          autocomplete="current-password"
        >
          <ion-icon
            slot="end"
            [name]="showPassword ? 'eye-off-outline' : 'eye-outline'"
            (click)="togglePassword()"
            class="password-toggle-icon"
            aria-label="Toggle password visibility"
          ></ion-icon>
        </ion-input>

        <div class="login-options">
          <!-- 3. Bound checkbox to ngModel -->
          <ion-checkbox labelPlacement="end" [(ngModel)]="rememberMe" name="rememberMe"> Remember me? </ion-checkbox>
          <span tabindex="0" role="button" routerLink="/forgot-password" class="forgot-link-text">
            Forgot Password?
          </span>
        </div>

        <!-- 4. Added click event and disabled state -->
        <ion-button
          expand="block"
          shape="round"
          color="tertiary"
          class="action-btn ion-margin-top"
          (click)="login()"
          [disabled]="isLoading"
        >
          {{ isLoading ? 'Logging in...' : 'Log In' }}
        </ion-button>

        <span tabindex="0" role="button" class="sign-up-link-text" routerLink="/register">
          Don't Have An Account? Sign Up
        </span>
      </ion-card-content>
    </ion-card>
  </div>
</ion-content>
