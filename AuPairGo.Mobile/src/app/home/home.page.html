<ion-content scrollY="false" [fullscreen]="true" class="ion-padding">
  <div class="page-wrapper">
    <ion-card class="custom-dark-card">
      <ion-card-content class="card-content-layout">
        <div class="logo-container">
          <img src="assets/images/AuPairGoLogo.png" alt="AuPairGoLogo" loading="lazy" />
        </div>

        <h1 style="font-weight: bold; color: #f1f1f1">Welcome To AuPairGo</h1>
        <br />

        <div class="button-group">
          <ion-button type="button" expand="block" shape="round" class="action-btn" routerLink="/login" color="primary">
            I AM A PARENT
            <ion-icon src="assets/icon/family-icon.svg" slot="end"></ion-icon>
          </ion-button>

          <ion-button
            type="button"
            expand="block"
            shape="round"
            class="action-btn"
            routerLink="/login"
            color="tertiary"
          >
            I AM A AU PAIR
            <ion-icon src="assets/icon/Steering-wheel-icon.svg" slot="end"></ion-icon>
          </ion-button>
        </div>
        <span tabindex="0" role="button" class="sign-up-link-text" routerLink="/register">
          Don't Have An Account? Sign Up
        </span>
      </ion-card-content>
    </ion-card>
  </div>
</ion-content>
